name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: claude/equity-ratio }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - shell: python
        run: |
          import sys, time; sys.path.insert(0, "screener")
          import yfinance as yf, build_data as b
          for c in ["4116","7203","8306","9984","2914","6758","8591","3633","9433","7578"]:
              t = yf.Ticker(f"{c}.T")
              try:
                  q = t.quarterly_balance_sheet
                  print(c, "rows:", [r for r in q.index if "Equity" in r or r=="Total Assets"][:6], "cols:", list(q.columns[:2]))
              except Exception as e: print(c, "err", e)
              print(c, "ER =", b.equity_ratio(t), "D/E =", t.info.get("debtToEquity"))
              time.sleep(1)
