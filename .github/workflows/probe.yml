name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q yfinance
      - shell: python
        run: |
          import yfinance as yf, datetime as dt
          print(yf.__version__)
          for kw in [dict(period="1y"), dict(period="5d"), dict(start="2026-10-20", end="2026-10-31"), dict(period="1mo", interval="1d")]:
              df = yf.download(["7203.T","6758.T"], group_by="ticker", auto_adjust=True, progress=False, **kw)
              print(kw, df["7203.T"].tail(3)[["Close","Volume"]].to_string())
          h = yf.Ticker("7203.T").history(period="5d")
          print("history", h.tail(3)[["Close","Volume"]].to_string())
