name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: claude/earnings-growth }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - shell: python
        run: |
          import sys, time; sys.path.insert(0, "screener")
          import yfinance as yf, build_data as b
          for c in ["6418","7957","4102","6862","8918","3933","285A","5019","6337","4521","5491","6675","5741","4014","8616","7203","6758","9984"]:
              t = yf.Ticker(f"{c}.T")
              print(c, "old", t.info.get("earningsGrowth"), "new", b.earnings_growth(t))
              time.sleep(0.5)
