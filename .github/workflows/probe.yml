name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q yfinance
      - shell: python
        run: |
          import yfinance as yf, time, pandas as pd
          pd.set_option("display.width",250)
          rows=["Net Income Common Stockholders","Net Income","Operating Income","Pretax Income","Total Revenue"]
          for c in ["6418","7957","4102","3933","5019","4521","7203","6758"]:
              t=yf.Ticker(f"{c}.T"); i=t.info
              print("==",c,"earningsGrowth",i.get("earningsGrowth"),"earningsQuarterlyGrowth",i.get("earningsQuarterlyGrowth"),"revenueGrowth",i.get("revenueGrowth"),"netIncomeToCommon",i.get("netIncomeToCommon"))
              for nm in ("quarterly_income_stmt","income_stmt"):
                  try:
                      df=getattr(t,nm); print(nm, df.shape); print((df.loc[[r for r in rows if r in df.index]]/1e8).round(1).to_string())
                  except Exception as e: print(nm,"err",e)
              time.sleep(1)
