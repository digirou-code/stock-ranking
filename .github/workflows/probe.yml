name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q yfinance pandas
      - shell: python
        run: |
          import yfinance as yf, pandas as pd, time
          pd.set_option("display.width",250); pd.set_option("display.max_columns",20)
          n_ok=0; codes=["7203","6758","6418","4116","9984","8306","6861","3697","4385","2914","7974","6098","2768","5016","9434","3994","4478","7011","6526","2413"]
          for c in codes:
              t=yf.Ticker(c+".T")
              try:
                  r=t.revenue_estimate
                  print("==",c); print(r)
                  if r is not None and len(r) and r["avg"].notna().any(): n_ok+=1
              except Exception as e: print("==",c,"ERR",e)
              try:
                  i=t.info; print("info rev keys", {k:i.get(k) for k in ("revenueGrowth","totalRevenue","forwardEps","trailingEps","numberOfAnalystOpinions")})
              except Exception as e: print("info ERR",e)
              time.sleep(1)
          print("REVEST_OK",n_ok,"/",len(codes))
