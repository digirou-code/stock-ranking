name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q requests pandas xlrd openpyxl
      - shell: python
        run: |
          import re, requests, io, pandas as pd
          pd.set_option("display.width",250); pd.set_option("display.max_columns",20); pd.set_option("display.max_colwidth",30)
          UA={"User-Agent":"Mozilla/5.0"}
          J="https://www.jpx.co.jp"
          def links(page, pat):
              h=requests.get(page,headers=UA,timeout=30).text
              out=re.findall(r'href="([^"]*'+pat+r')"',h)
              print("PAGE",page,len(h),len(out)); [print("  ",x) for x in out[:12]]
              return out
          def show(u, **kw):
              u=J+u if u.startswith("/") else u
              b=requests.get(u,headers=UA,timeout=60).content
              print("FILE",u,len(b))
              df=pd.read_excel(io.BytesIO(b),header=None, **kw)
              print(df.head(14).to_string()); print(df.shape)
          l=links(J+"/markets/statistics-equities/margin/01.html", r'\.(?:xls|xlsx|csv|zip|pdf)')
          x=[u for u in l if not u.endswith(".pdf")]
          if x:
              u=J+x[0]; b=requests.get(u,headers=UA,timeout=60).content; print("FILE",u,len(b),b[:4])
              if u.endswith(".csv"): print(b[:1500].decode("cp932","replace"))
              else:
                  df=pd.read_excel(io.BytesIO(b),header=None); print(df.head(14).to_string()); print(df.shape)
