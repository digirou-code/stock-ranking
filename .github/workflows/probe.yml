name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q yfinance pandas
      - shell: python
        run: |
          import yfinance as yf
          print("yfinance", yf.__version__)
          for c in ["6191", "2811", "3633", "7282", "8219", "4116", "9433", "8591"]:
              t = yf.Ticker(f"{c}.T"); i = t.info
              print("==", c, i.get("shortName"), "price", i.get("currentPrice") or i.get("regularMarketPrice"))
              for k in ["trailingAnnualDividendRate", "trailingAnnualDividendYield", "dividendRate", "dividendYield", "fiveYearAvgDividendYield", "lastDividendValue", "lastDividendDate", "exDividendDate", "payoutRatio", "lastSplitFactor", "lastSplitDate"]:
                  print("  ", k, i.get(k))
              d = t.dividends
              print("  dividends(last 8):"); print(d.tail(8).to_string())
              s = t.splits
              print("  splits:", s.tail(3).to_dict())
