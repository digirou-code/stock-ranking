name: system-daily

# 3枠システムの日次バッチ (設計書「日次レポート」)。J-Quants の当日分の更新後に動かす。
# 必要な Secrets: JQUANTS_API_KEY (必須)、MAIL_USER・MAIL_APP_PASSWORD・MAIL_TO (メールを送る場合)
on:
  schedule:
    - cron: "30 9 * * 1-5"   # 平日 18:30 JST
  workflow_dispatch:

concurrency:
  group: system-daily
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # 直近の日足・財務は Actions のキャッシュに置く (初回は API から約420営業日分を取る)
      - uses: actions/cache@v4
        with:
          path: data
          key: system-data-${{ github.run_id }}
          restore-keys: system-data-
      - name: daily batch
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m system.daily --mail
      - name: commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/system state
          git diff --cached --quiet || git commit -m "system daily $(TZ=Asia/Tokyo date +%F)"
          git pull --rebase -X theirs origin main
          git push
