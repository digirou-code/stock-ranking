# 事前登録した設定。バックテストを回す前にこのファイルをコミットし、結果を見てから数値を変えない。

[capital]
initial_yen = 30_000_000
cash_buffer = 0.03          # 総資産のこの割合は常に現金で残す
lot = 100                   # 売買単位 (株)
lot_overshoot = 1.5         # 1単元が目標額のこの倍率以下なら1単元買う
max_order_pct_of_turnover = 0.01  # 注文額 <= 売買代金(20日平均) x この値

[costs]
# 売買代金(20日平均, 億円) がこの値以上なら片道この%。既存検証 (backtest_pit.COST_TIERS) と同じ
tiers = [[10, 0.10], [3, 0.15], [1, 0.25], [0, 0.40]]
stress_add_pct = 0.20       # コスト試験: 片道に上乗せする%

[universe]
min_turnover_oku = 1.0      # 共通: 売買代金20日平均 (億円)
min_bars = 75               # 共通: 上場からの営業日数 (既存検証と同じ)
exclude_no_fins = true      # 決算短信が一度も無い銘柄 (ETF・REIT など) を除く

# 2026-11-02 ユーザー判断: 紙上運用は検証8 (大型株100%・R2そのまま) の構成で行う。
# 検証8は合格基準のうちコスト試験だけ不合格 (日経比 -1.5pt)。紙上運用で実際の売買コストを測る。
[sleeves.L]
name = "大型株 (売買代金上位)"
weight = 1.00
slots = 10
pool = 300                  # 売買代金上位300の中から
rule = "R2"
idle = "cash"

[sleeves.G]
name = "成長株"
weight = 0.0                # 紙上運用では使わない (検証8)。元は 0.35
slots = 7
rule = "R4"
idle = "etf"
variant = "G0"              # G0 = 現行SCORE業績 / G1 = 成長寄り。backtest の検証1で決める
min_mcap_oku = 300
max_per_sector = 2

[sleeves.R]
name = "急落リバウンド"
weight = 0.0                # 紙上運用では使わない (検証8)。元は 0.15
slots = 5
rule = "RB"
idle = "etf"
live = false                # 検証に合格するまで実資金を入れない (資金は日経ETF)
min_mcap_oku = 1000
min_turnover_oku = 3.0
min_equity_ratio = 30.0
max_per_sector = 2

[rules.R2]
name = "-6%損切り・+20%で半分・+40%で残り・最大25日"
stop = -6.0
t1 = 20.0
t2 = 40.0
days = 25

[rules.R4]
name = "-15%損切り・+30%で半分・残りは最大40日"
stop = -15.0
t1 = 30.0
t2 = 1000.0
days = 40

[rules.RB]
name = "直近安値割れ(最大-10%)で損切り・+15%か25日線回復で全部・最大15日"
stop = -10.0
t1 = 15.0
t2 = 15.0
days = 15

[risk]
dd_half = -0.15             # 過去最高からこの下落で新規買いを半分
dd_stop = -0.25             # この下落で新規買いを止める
dd_resume = -0.20           # ここより戻ったら再開
open_risk_warn = 0.12       # 全保有が損切りになった場合の損失合計の警告ライン
sector_warn = 0.35
single_warn = 0.10
daily_loss_warn = -0.03

[benchmark]
nikkei_etf = "13210"
topix_etf = "13060"

[pass]
excess_annual_pt = 3.0
pf = 1.3
rolling_majority = true
stress_excess_pt = 1.0
start_shift_wins = 9

[orders]
# 検証4で採用 (2024-08までのデータ): 寄りが前日終値+5%を超えたら買わない → 買いは「前日終値 x 1.05」の寄指
gap_limit = 0.05

[paper]
# 紙上運用の開始日 (この日の終値から売買を始めたとして毎日計算し直す)。実資金に移るまで live = false
start_date = "2026-11-02"
live = false
